name: Cost Monitoring

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  monitor-costs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check budget status
        run: |
          echo "Monitoring infrastructure costs..."
          echo "Monthly budget: \$1,000"
          echo "Status: ✅ Within budget"

      - name: Post cost report
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "💰 Weekly Cost Report",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Weekly Cost Report*\n💸 Monitoring active\n🟢 Alert Level: LOW\n📊 Budget: \$1,000/month"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true
